name: release

# Bump `version` in Cargo.toml, add a CHANGELOG.md section, commit, then push a
# matching tag (e.g. v0.2.0). This builds a universal DevDisk.app and publishes
# a GitHub release with a .dmg and a .zip.
#
# Optional secrets for a Developer ID signature + notarization (without them the
# app is ad-hoc signed; see "First launch" in the README):
#   MAC_CERTIFICATE_P12_BASE64, MAC_CERTIFICATE_PASSWORD, MAC_SIGN_IDENTITY,
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --release --locked

      - name: Import signing certificate
        if: env.MAC_CERTIFICATE_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

      - name: Build universal app, .zip and .dmg
        run: UNIVERSAL=1 PACKAGE=1 ./bundle.sh

      - name: Notarize
        if: env.APPLE_ID != '' && env.SIGN_IDENTITY != ''
        run: |
          DMG="dist/DevDisk-$VERSION.dmg"
          xcrun notarytool submit "$DMG" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$DMG"
          xcrun stapler staple dist/DevDisk.app
          rm "dist/DevDisk-$VERSION.zip"
          ditto -c -k --keepParent dist/DevDisk.app "dist/DevDisk-$VERSION.zip"

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 "DevDisk-$VERSION.dmg" "DevDisk-$VERSION.zip" > SHA256SUMS.txt

      - name: Release notes
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?"v"\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/DevDisk-$VERSION.dmg" "dist/DevDisk-$VERSION.zip" dist/SHA256SUMS.txt \
            --title "DevDisk $VERSION" --notes-file notes.md --verify-tag
